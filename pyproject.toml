[project]
name = "strixcodex"
version = "0.1.0"
description = "Local OpenAI-compatible proxy that bridges Strix AI to ChatGPT Codex backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
strixcodex = "strixcodex.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strixcodex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
